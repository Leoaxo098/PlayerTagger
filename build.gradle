plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories here if you need to depend on other mods.
    // See https://docs.fabricmc.net/develop/getting-started/setting-up-a-development-environment#adding-a-project-repository
    mavenCentral()
}

loom {
    // PlayerTagger is a client-only mod; entrypoints are declared as
    // "client" in fabric.mod.json, but we keep a single source set for
    // simplicity and reliable, reproducible builds.
    accessWidenerPath = null
}

dependencies {
    // To change the versions see the gradle.properties file.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = project.java_version as int
tasks.withType(JavaCompile).configureEach {
    it.options.release = targetJavaVersion
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()

    def javaVersionEnum = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersionEnum
    targetCompatibility = javaVersionEnum
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Configure a local/remote publishing repository here if desired.
    }
}
